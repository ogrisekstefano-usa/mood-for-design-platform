<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Mobile Workspace - Blueprint Chameleon™</title>
  <link rel="stylesheet" href="chameleon.css">
</head>
<body style="background: var(--bg-surface);">

  <div class="knowledge-strip" style="padding: 0 12px; height: 60px; flex-wrap:wrap; align-content:center;">
    <div style="width:100%; display:flex; justify-content:space-between; margin-bottom: 4px;">
      <div class="brand-name serif" style="font-size: 16px;">Riva1920</div>
      <div class="score-badge" style="border-color:var(--teal); color:var(--teal); padding:2px 8px;">
        SCORE: 87%
      </div>
    </div>
    <div class="metrics mono" style="font-size:10px; gap:12px;">
      <div class="metric">PRD <span class="metric-val">83</span></div>
      <div class="metric">MAT <span class="metric-val">24</span></div>
      <div class="metric">VAL <span class="metric-val" style="color:#facc15">14</span></div>
    </div>
  </div>

  <div class="mobile-view">
    <div class="mobile-tabs">
      <div class="m-tab">Document</div>
      <div class="m-tab active">Inspector</div>
      <div class="m-tab">Validazione</div>
    </div>

    <div class="col-content" style="padding: 24px 16px;">
      <div class="entity-card" style="margin-bottom:0;">
        <span class="entity-tag">Product</span>
        <h2 class="entity-name">KURA</h2>

        <div class="entity-fact">
          <span class="fact-label">Designer</span>
          <span class="fact-value">CR&S Riva1920</span>
        </div>
        <div class="entity-fact">
          <span class="fact-label">Materiali</span>
          <span class="fact-value">Noce Canaletto</span>
        </div>
        <div class="entity-fact">
          <span class="fact-label">Confidence</span>
          <span class="fact-value mono text-teal">94%</span>
        </div>

        <div class="actions-stack">
          <button class="btn btn-primary">Apri scheda</button>
          <button class="btn btn-atlas">Vai nel Brand Atlas &rarr;</button>
        </div>
      </div>

      <div class="graph-preview">
        <div class="graph-title">Relazioni</div>
        <div class="mono text-teal" style="font-size:12px; margin-bottom:12px;">38 Nodi Connessi</div>
        <p class="sec" style="font-size:12px;">(Visualizzazione grafo su mobile disabilitata per performance)</p>
      </div>
    </div>
  </div>

</body>
</html>
