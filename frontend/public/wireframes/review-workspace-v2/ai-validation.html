<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>AI Validation - Focus</title>
  <link rel="stylesheet" href="chameleon.css">
</head>
<body style="background: #000; display:flex; justify-content:center; align-items:center; height:100vh;">
  <div class="col ai-val-col" style="width: 480px; height: 80vh; border: 1px solid var(--border);">
    <div class="col-header">AI Validation (Massive Apply Focus)</div>
    <div class="col-content">
      <div class="val-card">
        <div class="val-header">
          <span class="val-type">DESIGNER AMBIGUO</span>
          <span class="mono sec">ID: 481</span>
        </div>
        <h3 class="val-title serif">CR&amp;S Riva 1920 vs CR&amp;S Riva</h3>
        <p class="val-desc">Il modello ha rilevato due nomenclature per lo stesso designer.</p>
        <div class="apply-scope">
          <div class="scope-option">
            <span class="scope-label">Applica solo qui</span>
            <span class="scope-impact">1 occorrenza</span>
          </div>
          <div class="scope-option">
            <span class="scope-label">Applica al catalogo</span>
            <span class="scope-impact">12 occorrenze in 1 pag</span>
          </div>
          <div class="scope-option" style="color:var(--teal); background:rgba(0,229,255,0.05); border-radius:4px;">
            <span class="scope-label">Applica all'intero brand</span>
            <span class="scope-impact" style="color:var(--teal)">84 occorrenze in 3 cat</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
