<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Knowledge Strip States</title>
  <link rel="stylesheet" href="chameleon.css">
</head>
<body style="background: #000; padding: 48px; display:flex; flex-direction:column; gap:48px;">

  <div style="color:var(--text-sec); font-size:12px; font-family:'JetBrains Mono'">STATE: REVIEWING (Active Extraction)</div>
  <div class="knowledge-strip" style="position:relative; border:1px solid var(--border)">
    <div class="brand-name serif">Riva1920 <span class="sec" style="font-size:12px; font-family:'Inter'">Knowledge Package™</span></div>
    <div class="metrics mono">
      <div class="metric">PRODOTTI <span class="metric-val">83</span><span class="delta">+2</span></div>
      <div class="metric">IMMAGINI <span class="metric-val">612</span><span class="delta">+14</span></div>
      <div class="metric">RELAZIONI <span class="metric-val">96</span><span class="delta">+5</span></div>
    </div>
    <div style="display:flex; gap: 16px; align-items:center;">
      <div class="score-badge"><span class="indicator"></span><span>14 ELEMENTI DA VALIDARE</span></div>
      <div class="score-badge" style="border-color:var(--teal); color:var(--teal)">SCORE: <span class="mono">87%</span></div>
    </div>
  </div>

  <div style="color:var(--text-sec); font-size:12px; font-family:'JetBrains Mono'">STATE: CERTIFIED (100% Score)</div>
  <div class="knowledge-strip" style="position:relative; border:1px solid var(--border)">
    <div class="brand-name serif">Riva1920 <span class="sec" style="font-size:12px; font-family:'Inter'">Knowledge Package™</span></div>
    <div class="metrics mono">
      <div class="metric">PRODOTTI <span class="metric-val">85</span></div>
      <div class="metric">IMMAGINI <span class="metric-val">626</span></div>
      <div class="metric">RELAZIONI <span class="metric-val">101</span></div>
    </div>
    <div style="display:flex; gap: 16px; align-items:center;">
      <div class="score-badge" style="border-color:#22c55e; color:#22c55e; background:rgba(34,197,94,0.05)">
        <span class="indicator" style="background:#22c55e; box-shadow:0 0 8px #22c55e"></span>
        <span>CERTIFICATO 100%</span>
      </div>
    </div>
  </div>

</body>
</html>
