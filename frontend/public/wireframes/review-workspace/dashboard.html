<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Validation Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbg: '#050505', panel: '#111111', accent: '#00e5ff' }, fontFamily: { serif: ['"Cormorant Garamond"', 'serif'], mono: ['"JetBrains Mono"', 'monospace'], sans: ['"Inter"', 'sans-serif'] } } } }
  </script>
  <style type="text/tailwindcss">
    @layer utilities { .glass { @apply bg-white/[0.03] border border-white/[0.08] backdrop-blur-md; } }
    body { @apply bg-darkbg text-gray-300 font-sans p-8 md:p-12; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=JetBrains+Mono:wght@400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  
  <div class="max-w-6xl mx-auto space-y-8">
    
    <div>
      <h2 class="font-mono text-xs uppercase text-gray-500 tracking-widest mb-2">Brand Knowledge Package™</h2>
      <h1 class="font-serif text-5xl text-white mb-6">RIVA1920</h1>
    </div>

    <div class="glass p-8 rounded-xl relative overflow-hidden border-t border-t-accent/50">
      <div class="absolute -top-24 -right-24 w-96 h-96 bg-accent/10 rounded-full blur-[100px] pointer-events-none"></div>
      
      <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-8 relative z-10">
        
        <div class="flex flex-col">
          <span class="font-mono text-xs text-gray-400 uppercase mb-2">Pagine Analizzate</span>
          <span class="font-serif text-4xl text-white">1.623</span>
          <div class="mt-2 h-8 w-full opacity-50 flex items-end gap-1" aria-hidden="true">
            <div class="w-1/6 bg-white/20 h-[20%] rounded-sm"></div><div class="w-1/6 bg-white/20 h-[40%] rounded-sm"></div><div class="w-1/6 bg-white/20 h-[30%] rounded-sm"></div><div class="w-1/6 bg-white/20 h-[70%] rounded-sm"></div><div class="w-1/6 bg-white/20 h-[60%] rounded-sm"></div><div class="w-1/6 bg-white/60 h-[100%] rounded-sm"></div>
          </div>
        </div>

        <div class="flex flex-col">
          <span class="font-mono text-xs text-gray-400 uppercase mb-2">Prodotti Identificati</span>
          <span class="font-serif text-4xl text-accent">128</span>
          <div class="mt-2 flex items-center text-xs text-accent gap-1 font-mono"><i data-lucide="trending-up" class="w-3 h-3"></i> +12 vs old</div>
        </div>

        <div class="flex flex-col">
          <span class="font-mono text-xs text-gray-400 uppercase mb-2">Materiali & Designer</span>
          <div class="flex items-baseline gap-2">
            <span class="font-serif text-4xl text-purple-400">36</span><span class="text-sm text-gray-500 font-mono">mat</span>
          </div>
          <div class="flex items-baseline gap-2 mt-1">
            <span class="font-serif text-2xl text-pink-400">12</span><span class="text-sm text-gray-500 font-mono">des</span>
          </div>
        </div>

        <div class="flex flex-col">
          <span class="font-mono text-xs text-gray-400 uppercase mb-2">Immagini / Asset</span>
          <span class="font-serif text-4xl text-white">764</span>
          <span class="text-xs font-mono text-gray-500 mt-2">120 HR / 644 Web</span>
        </div>

        <div class="flex flex-col">
          <span class="font-mono text-xs text-gray-400 uppercase mb-2">Quality & Accuracy</span>
          <div class="flex items-baseline gap-2">
            <span class="font-serif text-4xl text-green-400">92%</span><span class="text-xs font-mono text-gray-500 uppercase">Acc</span>
          </div>
          <div class="flex items-baseline gap-2 mt-1">
            <span class="font-serif text-2xl text-accent">84%</span><span class="text-xs font-mono text-gray-500 uppercase">KS</span>
          </div>
        </div>

      </div>

      <div class="mt-10 pt-6 border-t border-white/10 grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="flex items-center gap-3 glass p-4 rounded-lg">
          <div class="p-2 bg-red-500/10 text-red-400 rounded-lg border border-red-500/20"><i data-lucide="x-circle" class="w-5 h-5"></i></div>
          <div><div class="font-mono text-lg text-white">0 Errori</div><div class="text-xs text-gray-500">Bloccanti</div></div>
        </div>
        <div class="flex items-center gap-3 glass p-4 rounded-lg border-amber-500/20">
          <div class="p-2 bg-amber-500/10 text-amber-400 rounded-lg border border-amber-500/20 animate-pulse"><i data-lucide="alert-triangle" class="w-5 h-5"></i></div>
          <div><div class="font-mono text-lg text-white">12 Warning</div><div class="text-xs text-amber-500/80">Da revisionare nel Workspace</div></div>
        </div>
      </div>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
