<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Catalog Detail with Actions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbg: '#050505', panel: '#111111', accent: '#00e5ff' }, fontFamily: { serif: ['"Cormorant Garamond"', 'serif'], mono: ['"JetBrains Mono"', 'monospace'], sans: ['"Inter"', 'sans-serif'] } } } }
  </script>
  <style type="text/tailwindcss">
    @layer utilities { .glass { @apply bg-white/[0.03] border border-white/[0.08] backdrop-blur-md; } }
    body { @apply bg-darkbg text-gray-300 font-sans p-8 md:p-12; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=JetBrains+Mono:wght@400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  
  <div class="max-w-5xl mx-auto space-y-6">
    <h3 class="font-mono text-xs uppercase text-gray-500 tracking-widest mb-4">Pipeline Documenti</h3>
    
    <!-- Row 1: Needs Review -->
    <div class="glass rounded-lg p-4 flex flex-col md:flex-row items-start md:items-center justify-between group hover:bg-white/[0.05] transition gap-4">
      <div class="flex items-center gap-4">
        <div class="w-10 h-10 shrink-0 bg-amber-500/10 text-amber-500 rounded flex items-center justify-center border border-amber-500/20">
          <i data-lucide="alert-triangle" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="font-serif text-lg text-white group-hover:text-accent transition">RIVA1920_ICONS2025-1.pdf</div>
          <div class="text-xs font-mono text-gray-500 flex items-center gap-3 mt-1">
            <span>274 Pag</span> <span>•</span> <span class="text-amber-400">12 Warning</span>
          </div>
        </div>
      </div>
      
      <div class="flex items-center gap-3 self-end md:self-auto w-full md:w-auto justify-end">
        <div class="px-3 py-1 bg-amber-500/10 border border-amber-500/20 rounded text-amber-400 font-mono text-xs uppercase animate-pulse">
          Necessita Controllo
        </div>
        <button data-testid="open-workspace-btn" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded font-mono text-xs uppercase border border-white/20 transition flex items-center gap-2">
          <i data-lucide="external-link" class="w-3 h-3"></i> Apri Workspace
        </button>
      </div>
    </div>

    <!-- Row 2: Certificato -->
    <div class="glass rounded-lg p-4 flex flex-col md:flex-row items-start md:items-center justify-between group hover:bg-white/[0.05] transition opacity-70">
      <div class="flex items-center gap-4">
        <div class="w-10 h-10 shrink-0 bg-green-500/10 text-green-500 rounded flex items-center justify-center border border-green-500/20">
          <i data-lucide="check-circle" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="font-serif text-lg text-white">RIVA1920_OUTDOOR_2024.pdf</div>
          <div class="text-xs font-mono text-gray-500 flex items-center gap-3 mt-1">
            <span>82 Pag</span> <span>•</span> <span class="text-green-400">Accuracy 98%</span>
          </div>
        </div>
      </div>
      
      <div class="flex items-center gap-3 self-end md:self-auto w-full md:w-auto justify-end">
        <div class="px-3 py-1 bg-green-500/5 border border-green-500/20 rounded text-green-400 font-mono text-xs uppercase">
          Certificato
        </div>
        <button data-testid="view-data-btn" class="px-4 py-2 bg-transparent hover:bg-white/5 text-gray-400 rounded font-mono text-xs uppercase border border-transparent transition flex items-center gap-2">
          <i data-lucide="eye" class="w-3 h-3"></i> Vedi Dati
        </button>
      </div>
    </div>

    <!-- Row 3: In Estrazione -->
    <div class="glass rounded-lg p-4 flex flex-col md:flex-row items-start md:items-center justify-between group hover:bg-white/[0.05] transition gap-4">
      <div class="flex items-center gap-4 w-full md:w-auto">
        <div class="w-10 h-10 shrink-0 bg-accent/10 text-accent rounded flex items-center justify-center border border-accent/20 relative overflow-hidden">
          <div class="absolute inset-0 bg-accent/20 animate-pulse"></div>
          <i data-lucide="cpu" class="w-5 h-5 relative z-10"></i>
        </div>
        <div class="flex-1">
          <div class="font-serif text-lg text-white">RIVA1920_MATERIOTEQ.pdf</div>
          <div class="text-xs font-mono text-gray-500 flex items-center gap-3 mt-1">
            <span>Estrazione Entità</span> <span class="text-accent">45%</span>
          </div>
        </div>
      </div>
      
      <div class="flex items-center gap-4 self-end md:self-auto w-full md:w-auto justify-end">
        <div class="w-32 h-1.5 bg-white/10 rounded overflow-hidden">
          <div class="h-full bg-accent w-[45%]"></div>
        </div>
        <div class="px-3 py-1 bg-accent/10 border border-accent/20 rounded text-accent font-mono text-xs uppercase">
          In elaborazione
        </div>
        <button data-testid="cancel-extraction-btn" class="p-2 bg-transparent hover:bg-red-500/10 text-gray-500 hover:text-red-400 rounded border border-transparent transition flex items-center justify-center">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Row 4: Errore -->
    <div class="glass rounded-lg p-4 flex flex-col md:flex-row items-start md:items-center justify-between group hover:bg-white/[0.05] transition border-red-500/20 gap-4">
      <div class="flex items-center gap-4">
        <div class="w-10 h-10 shrink-0 bg-red-500/10 text-red-500 rounded flex items-center justify-center border border-red-500/20">
          <i data-lucide="alert-octagon" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="font-serif text-lg text-white">RIVA_CORRUPTED_FILE.pdf</div>
          <div class="text-xs font-mono text-gray-500 flex items-center gap-3 mt-1">
            <span class="text-red-400">Errore parser: OCR fallito a pag. 4</span>
          </div>
        </div>
      </div>
      
      <div class="flex items-center gap-3 self-end md:self-auto w-full md:w-auto justify-end">
        <div class="px-3 py-1 bg-red-500/10 border border-red-500/20 rounded text-red-400 font-mono text-xs uppercase">
          Fallito
        </div>
        <button data-testid="retry-btn" class="px-4 py-2 bg-white/5 hover:bg-white/10 text-white rounded font-mono text-xs uppercase border border-white/10 transition flex items-center gap-2">
          <i data-lucide="refresh-cw" class="w-3 h-3"></i> Riesegui
        </button>
      </div>
    </div>

  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
